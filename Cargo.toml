[package]
name = "clifpad"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native scratchpad: Cranelift IR text in, JIT-compiled machine behaviour out, for developers and coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hewigovens/clifpad"
keywords = ["cranelift", "jit", "repl", "mcp", "scratchpad"]
categories = ["development-tools", "compilers"]
# The crate needs only the code, tests, example and the cheat sheet compiled into the MCP tool description.
exclude = [".github", "CLAUDE.md", "prompts/results", "prompts/runs", "prompts/experiment.py", "prompts/tasks.json", "scripts"]

[dependencies]
anyhow = "1"
cranelift = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"
cranelift-reader = "0.135"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
